name: Tarea o mejora
description: Algo para construir o cambiar en Freelancer
labels: [tarea]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué se necesita
    validations:
      required: true
  - type: textarea
    id: criterio
    attributes:
      label: Cómo sabremos que está listo
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Clientes, Proyectos, Tareas, UI, CI, Docs]
