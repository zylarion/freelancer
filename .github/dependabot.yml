version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Bogota }
    open-pull-requests-limit: 3
    # Esperar antes de proponer versiones recién publicadas (paquetes maliciosos suelen detectarse en días).
    cooldown: { default-days: 7, semver-major-days: 30 }
    commit-message: { prefix: chore, include: scope }
    groups:
      menores: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Bogota }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }
